name: CI (build & test)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # فقط پروژه‌ی تست + وابستگی‌هایش (Application/Infrastructure/Domain) ساخته می‌شود؛
    # WPF (وابسته به Telerik تجاری/لوکال) عمداً در CI ساخته نمی‌شود.
    # منبع به‌صراحت nuget.org تا منبع لوکال Telerik در NuGet.config نادیده گرفته شود.
    - name: Restore test project
      run: dotnet restore tests/SamaHesab.Tests/SamaHesab.Tests.csproj --source https://api.nuget.org/v3/index.json

    - name: Build
      run: dotnet build tests/SamaHesab.Tests/SamaHesab.Tests.csproj -c Release --no-restore

    - name: Test
      run: dotnet test tests/SamaHesab.Tests/SamaHesab.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/test-results.trx'
        if-no-files-found: ignore
