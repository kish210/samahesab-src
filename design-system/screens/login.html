<!-- @dsCard group="ERP Screens" viewport="1280x800" name="ورود به سیستم" subtitle="صفحه لاگین سماع‌حساب" -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سماع‌حساب — ورود به سیستم</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(110% 80% at 50% -10%, rgba(75,95,151,.30), transparent 60%),
      linear-gradient(160deg, var(--blue-900) 0%, #1F2F50 100%); }
  body::before { content: ""; position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size: 24px 24px; }

  .card { position: relative; width: 360px; background: #fff; border-radius: 16px;
    box-shadow: 0 24px 60px rgba(8,14,28,.45); padding: 32px 32px 24px; }

  .head { text-align: center; margin-bottom: 24px; }
  .mark { width: 52px; height: 52px; border-radius: 13px; background: var(--blue-700); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 26px;
    margin: 0 auto 14px; box-shadow: 0 6px 16px rgba(50,74,122,.35); }
  .head h1 { font-size: 19px; font-weight: 800; color: var(--text-strong); }
  .head .sub { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }

  .lform { display: flex; flex-direction: column; gap: 13px; }
  .lfield label { display: block; font-size: 12px; font-weight: 500; color: var(--text-body); margin-bottom: 6px; }
  .lwrap { position: relative; }
  .lwrap .ic { position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--gray-400); pointer-events: none; }
  .lwrap .eye { position: absolute; inset-inline-end: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--gray-400); cursor: pointer; background: none; border: none; padding: 0; }
  .lwrap input, .lwrap select { width: 100%; height: 44px; border: 1px solid var(--border-strong); border-radius: 9px;
    background: #fff; color: var(--text-strong); font-family: var(--font-sans); font-size: 13.5px; padding: 0 38px; }
  .lwrap input::placeholder { color: var(--gray-400); }
  .lwrap input:hover, .lwrap select:hover { border-color: var(--gray-400); }
  .lwrap input:focus, .lwrap select:focus { outline: none; border-color: var(--blue-600); box-shadow: var(--ring-focus); }
  .lwrap select { appearance: none; cursor: pointer; }
  .lwrap .chev { position: absolute; inset-inline-end: 13px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--gray-400); pointer-events: none; }

  .lrow { display: flex; align-items: center; justify-content: space-between; margin-top: 1px; }
  .lremember { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-body); cursor: pointer; user-select: none; }
  .lremember .box { width: 16px; height: 16px; border-radius: 4px; background: var(--blue-600); display: flex; align-items: center; justify-content: center; }
  .lremember .box svg { width: 10px; height: 10px; color: #fff; }
  .lrow a { font-size: 12px; color: var(--text-link); font-weight: 500; }

  .lsubmit { height: 46px; border: none; border-radius: 9px; background: var(--blue-600); color: #fff;
    font-family: var(--font-sans); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px;
    display: flex; align-items: center; justify-content: center; gap: 8px; transition: background var(--dur) var(--ease); }
  .lsubmit:hover { background: var(--blue-700); }
  .lsubmit svg { width: 18px; height: 18px; }

  .foot { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--gray-100); }
  .foot b { color: var(--text-body); font-weight: 600; }
</style>
</head>
<body>
<div class="card" data-screen-label="Login">
  <div class="head">
    <div class="mark">س</div>
    <h1>ورود به سماع‌حساب</h1>
    <div class="sub">سامانه جامع مدیریت مالی و کسب‌وکار</div>
  </div>

  <form class="lform" onsubmit="return false">
    <div class="lfield">
      <label>شرکت</label>
      <div class="lwrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 7h.01M15 7h.01M9 11h.01M15 11h.01M10 21v-3h4v3"/></svg>
        <select>
          <option>شرکت اول — شعبه مرکزی</option>
          <option>فروشگاه قطعات خودرو</option>
          <option>رستوران دریا</option>
        </select>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>
      </div>
    </div>

    <div class="lfield">
      <label>نام کاربری</label>
      <div class="lwrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
        <input type="text" value="admin" />
      </div>
    </div>

    <div class="lfield">
      <label>رمز عبور</label>
      <div class="lwrap">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" value="123456789" id="pw" />
        <button type="button" class="eye" onclick="var p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="lrow">
      <label class="lremember"><span class="box"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span>مرا به خاطر بسپار</label>
      <a href="#">فراموشی رمز؟</a>
    </div>

    <button class="lsubmit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>ورود به سیستم</button>
  </form>

  <div class="foot"><b>سماع رایانه کیش</b> · نسخه ۱٫۰٫۰</div>
</div>
</body>
</html>
