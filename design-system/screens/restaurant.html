<!-- @dsCard group="ERP Screens" viewport="1280x720" name="رستوران (لمسی)" subtitle="صفحه عملیاتی سماع‌حساب" -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>سماع‌حساب — رستوران</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="erp.css" />
<style>
  .rest { display: flex; gap: 10px; flex: 1; min-height: 0; }
  .rest-main { flex: 1.4; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .rest-order { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 340px; max-width: 410px; }
  /* نقشه میز */
  .floor-tabs { display: flex; gap: 7px; }
  .floor-tabs .ft { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--text-body); cursor: pointer; }
  .floor-tabs .ft.on { background: var(--blue-700); border-color: var(--blue-700); color: #fff; }
  .tables { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; align-content: start; }
  .tbl-card { aspect-ratio: 1.15; border-radius: 11px; border: 1.5px solid var(--border-strong); background: #fff; padding: 11px; display: flex; flex-direction: column; cursor: pointer; user-select: none; position: relative; transition: transform 80ms; }
  .tbl-card:active { transform: scale(.97); }
  .tbl-card .tn { font-size: 15px; font-weight: 800; color: var(--text-strong); }
  .tbl-card .seats { font-size: 11px; color: var(--text-muted); }
  .tbl-card .foot { margin-top: auto; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tbl-card .badge2 { position: absolute; top: 9px; inset-inline-end: 9px; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; }
  .tbl-card.free { border-style: dashed; border-color: var(--gray-300); }
  .tbl-card.free .tn, .tbl-card.free .foot { color: var(--text-muted); }
  .tbl-card.busy { border-color: var(--blue-600); background: var(--blue-50); }
  .tbl-card.busy .foot { color: var(--blue-700); }
  .tbl-card.busy .badge2 { background: var(--blue-600); color: #fff; }
  .tbl-card.bill { border-color: var(--gold-500); background: var(--gold-50); }
  .tbl-card.bill .foot { color: var(--gold-700); }
  .tbl-card.bill .badge2 { background: var(--gold-500); color: #fff; }
  .tbl-card.free .badge2 { background: var(--gray-150); color: var(--gray-600); }
  /* منو */
  .menu-cats { display: flex; gap: 6px; overflow-x: auto; }
  .menu-cats .mc { flex: none; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid var(--border-strong); background: #fff; font-family: var(--font-sans); font-size: 12.5px; font-weight: 600; color: var(--text-body); cursor: pointer; }
  .menu-cats .mc.on { background: var(--blue-700); border-color: var(--blue-700); color: #fff; }
  /* سفارش جاری */
  .order-card { flex: 1; display: flex; flex-direction: column; background: #fff; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; min-height: 0; }
  .order-card .hd { display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: var(--blue-700); color: #fff; }
  .order-card .hd .tn { font-size: 15px; font-weight: 800; }
  .order-card .hd .m { font-size: 11px; color: var(--blue-200); margin-inline-start: auto; }
  .order-card .rows { flex: 1; overflow-y: auto; }
  .orow { display: flex; align-items: center; gap: 9px; padding: 8px 13px; border-bottom: 1px solid var(--gray-100); }
  .orow .t { flex: 1; font-size: 13px; font-weight: 600; color: var(--text-strong); }
  .orow .t .sub { font-size: 10.5px; color: var(--text-muted); font-weight: 400; }
  .orow .q { display: flex; align-items: center; gap: 3px; }
  .orow .q button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-strong); background: #fff; font-size: 15px; cursor: pointer; }
  .orow .q .n { width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .orow .amt { width: 78px; text-align: end; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; direction: ltr; }
  .ot { border-top: 1px solid var(--border); }
  .ot .r { display: flex; justify-content: space-between; padding: 5px 14px; font-size: 12px; color: var(--text-muted); }
  .ot .r .v { font-variant-numeric: tabular-nums; color: var(--text-body); font-weight: 600; direction: ltr; }
  .ot .grand { background: var(--gray-100); padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); }
  .ot .grand .l { font-size: 13px; font-weight: 700; color: var(--text-strong); }
  .ot .grand .v { font-size: 21px; font-weight: 800; color: var(--blue-700); font-variant-numeric: tabular-nums; direction: ltr; }
  .obtns { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .obtns button { height: 46px; border-radius: 8px; border: 1px solid var(--border-strong); background: #fff; font-family: var(--font-sans); font-size: 13px; font-weight: 700; color: var(--text-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px; }
  .obtns button svg { width: 17px; height: 17px; color: var(--blue-600); }
  .obtns .kot { grid-column: 1/-1; background: var(--success-500); border-color: var(--success-500); color: #fff; height: 52px; font-size: 15px; }
  .obtns .kot svg { color: #fff; }
  .obtns .kot:hover { background: var(--success-700); }
</style>
</head>
<body>
<div class="erp" data-screen-label="Restaurant">
  <header class="erp-top" id="erp-top"></header>
  <div class="erp-body">
    <aside class="erp-side" id="erp-side"></aside>
    <div class="erp-main">
      <div class="erp-tabs" id="erp-tabs"></div>

      <div class="erp-content" style="display:flex;flex-direction:column;gap:10px">
        <div class="rest">
          <!-- نقشه میز + منو -->
          <div class="rest-main">
            <div class="floor-tabs">
              <button class="ft on">سالن اصلی</button>
              <button class="ft">سالن خانوادگی</button>
              <button class="ft">تراس</button>
              <button class="ft" style="margin-inline-start:auto;color:var(--text-muted)">بیرون‌بر / پیک</button>
            </div>
            <div class="tables" id="tables"></div>

            <div class="menu-cats">
              <button class="mc on">غذای اصلی</button>
              <button class="mc">کباب</button>
              <button class="mc">پیش‌غذا</button>
              <button class="mc">نوشیدنی</button>
              <button class="mc">دسر</button>
            </div>
            <div class="tables" style="flex:none;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))" id="menu"></div>
          </div>

          <!-- سفارش میز -->
          <div class="rest-order">
            <div class="order-card">
              <div class="hd">
                <span class="tn">میز ۵</span>
                <span style="font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:99px">۴ نفر</span>
                <span class="m">گارسون: مجید · ۱۹:۴۲</span>
              </div>
              <div class="rows" id="order"></div>
              <div class="ot">
                <div class="r"><span>جمع اقلام</span><span class="v">1,158,000</span></div>
                <div class="r"><span>مالیات و خدمات ۱۰٪</span><span class="v">115,800</span></div>
                <div class="grand"><span class="l">جمع کل</span><span class="v">1,273,800</span></div>
              </div>
            </div>
            <div class="obtns">
              <button class="kot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h12"/></svg>ارسال به آشپزخانه (KOT)</button>
              <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>صورتحساب</button>
              <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M21 3l-7 7M8 21H3v-5M3 21l7-7"/></svg>انتقال میز</button>
              <button style="grid-column:1/-1;background:var(--blue-700);border-color:var(--blue-700);color:#fff"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg>تسویه و پرداخت</button>
            </div>
          </div>
        </div>
      </div>

      <footer class="erp-status" id="erp-status"></footer>
    </div>
  </div>
</div>

<script src="erp-shell.js"></script>
<script>
  ErpShell.mount({
    active: 'restaurant',
    menu: 'فروش',
    tabs: [['رستوران — سالن اصلی','restaurant.html',true]],
    status: { form: 'رستوران', extra: 'شیفت شام · گارسون مجید' }
  });

  // [num, seats, state, info]  state: free/busy/bill
  const tables = [
    ['۱','۲','free','آزاد'],['۲','۴','busy','۸۴۰٬۰۰۰'],['۳','۴','free','آزاد'],
    ['۴','۶','busy','۱٬۵۲۰٬۰۰۰'],['۵','۴','busy','۱٬۲۷۳٬۸۰۰'],['۶','۲','bill','صورتحساب'],
    ['۷','۸','busy','۳٬۲۴۰٬۰۰۰'],['۸','۴','free','آزاد'],['۹','۲','free','آزاد'],
    ['۱۰','۴','bill','صورتحساب'],['۱۱','۶','busy','۹۸۰٬۰۰۰'],['۱۲','۴','free','آزاد'],
  ];
  const stLabel = { free:'آزاد', busy:'فعال', bill:'صورتحساب' };
  document.getElementById('tables').innerHTML = tables.map((t,i)=>`
    <div class="tbl-card ${t[2]} ${t[0]==='۵'?'':''}" style="${t[0]==='۵'?'box-shadow:0 0 0 2px var(--blue-600)':''}">
      <span class="badge2">${stLabel[t[2]]}</span>
      <div class="tn">میز ${t[0]}</div>
      <div class="seats">${t[1]} نفره</div>
      <div class="foot">${t[3]}${t[2]!=='free'&&t[2]!=='bill'?' ریال':''}</div>
    </div>`).join('');

  const menu = [
    ['چلوکباب کوبیده','۲۸۰٬۰۰۰'],['چلوکباب برگ','۴۸۰٬۰۰۰'],['جوجه‌کباب','۳۲۰٬۰۰۰'],
    ['زرشک‌پلو با مرغ','۲۹۰٬۰۰۰'],['قورمه‌سبزی','۲۴۰٬۰۰۰'],['میگو سوخاری','۵۲۰٬۰۰۰'],
    ['سالاد فصل','۸۵٬۰۰۰'],['دوغ محلی','۴۵٬۰۰۰'],['نوشابه','۳۵٬۰۰۰'],
  ];
  document.getElementById('menu').innerHTML = menu.map(m=>`
    <div class="tbl-card" style="aspect-ratio:auto;min-height:64px;border-style:solid;border-color:var(--border)">
      <div class="tn" style="font-size:13px;font-weight:600">${m[0]}</div>
      <div class="foot" style="color:var(--blue-700)">${m[1]} ریال</div>
    </div>`).join('');

  const order = [
    ['چلوکباب برگ','بدون پیاز','1','480,000'],
    ['جوجه‌کباب','','2','640,000'],
    ['سالاد فصل','','1','85,000'],
    ['دوغ محلی','','2','90,000'],
  ];
  document.getElementById('order').innerHTML = order.map(o=>`
    <div class="orow">
      <div class="t">${o[0]}${o[1]?`<div class="sub">${o[1]}</div>`:''}</div>
      <div class="q"><button>−</button><span class="n">${o[2]}</span><button>+</button></div>
      <div class="amt">${o[3]}</div>
    </div>`).join('');
</script>
</body>
</html>
